Results:
  save_results: False
  save_dir: "results"
  save_trj: False
  save_trj_kf_intv: 0
  use_gui: True
  eval_rendering: False
  # With eval_rendering: offline color refinement (26000 iterations, poses
  # frozen) before the after_opt rendering metrics. Does not change the ATE.
  # slam.py --skip_color_refinement sets it to False (D61).
  color_refinement: True
  use_wandb: False
  # Keyframe trajectory analysis printed at the end of each run
  # (utils/trajectory_analysis.py): sliding-window size for the local
  # Sim(3) and frames per reporting range. Logging only.
  trajectory_analysis:
    window_kf: 30
    range_step_frames: 250

Dataset:
  sensor_type: 'monocular'
  pcd_downsample: 32
  pcd_downsample_init: 32
  adaptive_pointsize: True
  point_size: 0.01
  type: 'realsense'

Training:
  init_itr_num: 1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  tracking_itr_num: 50
  mapping_itr_num: 50
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 2001
  size_threshold: 20
  kf_interval: 5
  window_size: 8
  pose_window: 3
  edge_threshold: 1.1
  rgb_boundary_threshold: 0.01
  sync_mode: "parallel"
  spherical_harmonics: True

  kf_translation: 0.05
  kf_min_translation: 0.02
  kf_overlap: 0.9
  kf_cutoff: 0.3
  prune_mode: 'slam'

  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001


opt_params:
  iterations: 30000
  position_lr_init: 0.0016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002

model_params:
  sh_degree: 0
  source_path: ""
  model_path: ""
  resolution: -1
  white_background: False
  data_device: "cuda"

pipeline_params:
  convert_SHs_python: False
  compute_cov3D_python: False
  # Rasterizer background color (RGB). Required, no default. Black = pixels
  # not covered by any Gaussian receive no light (docs/DECISIONS.md D9).
  background: [0, 0, 0]

# Co-located light model (light_models/). false = original MonoGS.
# Required key: there is no default (CLAUDE.md section 2).
Light:
  enabled: False

# Loss options of the light extension, used by tracking AND mapping
# (docs/DECISIONS.md D2, D3). Required, no default. These two values
# reproduce original MonoGS.
LightTracking:
  loss_color_space: srgb   # srgb | linear (linear needs Light.enabled)
  exposure_affine: True    # exp(a)*I + b on the prediction, in the loss space
  pixel_weight:
    enabled: False         # light-model pixel weights (docs/DECISIONS.md D15)
  saturation_mask:
    enabled: False         # drop saturated observations (docs/DECISIONS.md D31)
  min_gradient:
    enabled: False         # absolute gradient floor for tracking pixels (D37)
