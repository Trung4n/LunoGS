# rgbd_lambert_calib_ambgrid_cell0p5_parallel_fused.yaml (how the main model
# runs, D139) with the growing ambient box of rgbd_lambert_calib_ambgrid_growing.yaml
# (docs/DECISIONS.md D144). Run with --backend_gpu 1 on two GPUs.
inherit_from: "configs/light/rgbd_lambert_calib_ambgrid_cell0p5_parallel_fused.yaml"

Light:
  ambient:
    _replace: true
    type: position_grid_growing
    c: {source: value, value: 0.05, learnable: true, lr: 0.001, prior_weight: 0.0, at_bound: project}
    channels: 1
    cell_m: 0.5
    capacity: 100000
    margin_m: 1.0
    residual_lr: 0.001
    l1_weight: 0.05
