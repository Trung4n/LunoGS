# Main model with a REAL pre-calibration of the lamp (docs/DECISIONS.md D106)
# instead of the oracle values of light_params.json (fitted by the data repo
# from ground-truth albedo, normals and EXR depth, D13):
#   - lamp (K, t_CL, R_CL, emission profile as a table) from
#     <dataset>/calib/light_calibrated.json, written by
#     tools/calibrate/fit_light.py from the flat-target clip <dataset>/calib
#     (8-bit images + sensor depth only; spline one pass, t_CL not measured);
#   - the ambient light c belongs to the SCENE, not to the lamp: learned in
#     mapping from a guess, as DarkGS re-optimises its ambient per scene.
#     The guess is not a measurement of either room (office0 0.12, room0
#     0.06 in the data); started after 10 keyframes like rgbd_nocos_learn_all
#     (D65); at_bound project as the self-calibration (D70).
# K is in the units of the calibration target's nominal albedo
# (Calibration.target_albedo), so the albedo scale of the map, and the
# absolute colour learning rate of the main model, stay as before.
inherit_from: "configs/light/rgbd_lambert_edgefd_untrusted.yaml"

Light:
  params_file: calib/light_calibrated.json
  intensity: {source: params_file, key: light.intensity, learnable: false}
  pose:
    t_CL: {source: params_file, key: light.t_CL_m, learnable: false}
    R_CL: {source: params_file, key: light.R_CL, learnable: false}
  angular:
    _replace: true
    type: tabulated
    knots_deg: {source: params_file, key: light.angular.knots_deg, learnable: false}
    values: {source: params_file, key: light.angular.knot_values, learnable: false}
    interpolation: linear_cos
  ambient:
    c: {_replace: true, source: value, value: 0.05, learnable: true, lr: 0.0001, prior_weight: 0.0,
        at_bound: project}
  schedule:
    - {after_keyframes: 10, unfreeze: [ambient.c]}
