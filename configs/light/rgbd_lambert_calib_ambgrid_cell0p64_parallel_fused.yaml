# Grid cell sweep of D127 on the D134-D136 code, run like the main model
# (rgbd_lambert_calib_ambgrid_cell1p0_parallel_fused.yaml): only the cell
# differs, so the four cell sizes (0.5, 0.64, 0.8, 1 m) share the same
# tracking speed and hence the same mapping budget.
inherit_from: "configs/light/rgbd_lambert_calib_ambgrid_cell1p0_parallel_fused.yaml"

Light:
  ambient:
    cell_m: 0.64
