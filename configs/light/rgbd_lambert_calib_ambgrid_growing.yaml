# rgbd_lambert_calib_ambgrid.yaml (main model, 0.5 m ambient grid, D139) with
# the grid on a dense box that grows with the scene seen (position_grid_growing,
# docs/DECISIONS.md D144) instead of a cube of half side 8 m fixed around the
# world origin: no bound on the scene, and the direct addressing of a dense
# grid (no search, unlike position_grid_sparse, D143).
#   - margin_m 1.0: when a keyframe's points fall outside the box, it grows to
#     hold them plus 1 m on that side, so that it grows only a few times.
#   - capacity 100000: vertex buffer, fixed size (CUDA graphs and the compiled
#     shading read fixed buffers), 400 KB. A box of 0.5 m cells around office0
#     with the margin is about 2300 vertices, room0 about 3500; 100000 holds a
#     30 x 20 x 3 m floor. A larger box stops the run with an error.
inherit_from: "configs/light/rgbd_lambert_calib_ambgrid.yaml"

Light:
  ambient:
    _replace: true
    type: position_grid_growing
    c: {source: value, value: 0.05, learnable: true, lr: 0.001, prior_weight: 0.0, at_bound: project}
    channels: 1
    cell_m: 0.5
    capacity: 100000
    margin_m: 1.0
    residual_lr: 0.001
    l1_weight: 0.05
