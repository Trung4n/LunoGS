# Calibration sensitivity (docs/DECISIONS.md D57): rgbd_nocos.yaml with ONE
# light parameter deliberately wrong.
# Error: light axis tilted 1 deg about the camera x axis (R_CL rotated in the
# camera frame).
# The nominal value is still the estimate read from light_params.json; only
# the error below is written here. Everything else is rgbd_nocos.yaml.
inherit_from: "configs/light/rgbd_nocos.yaml"

Light:
  pose:
    R_CL: {perturb: {rotate_deg: 1.0, axis: [1.0, 0.0, 0.0]}}
