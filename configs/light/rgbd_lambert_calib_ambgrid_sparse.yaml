# rgbd_lambert_calib_ambgrid.yaml (main model, 0.5 m ambient grid, D139) with
# the grid's vertices allocated where the map is seen (position_grid_sparse,
# docs/DECISIONS.md D143) instead of a dense cube of half side 8 m around the
# world origin: no bound on the scene size, memory follows the surface seen.
# Same field, same learning: with every vertex the surface touches allocated
# the two forms shade identically (tests/light/test_ambient_position_grid_sparse.py).
#   - capacity 20000: vertex pool, fixed size (CUDA graphs and the compiled
#     shading read fixed buffers). Measured need at 0.5 m (sensor depth of
#     every 7th frame, GT poses, scratch): office0 743, room0 1193 vertices.
#     A full pool stops the run with an error.
inherit_from: "configs/light/rgbd_lambert_calib_ambgrid.yaml"

Light:
  ambient:
    _replace: true
    type: position_grid_sparse
    c: {source: value, value: 0.05, learnable: true, lr: 0.001, prior_weight: 0.0, at_bound: project}
    channels: 1
    cell_m: 0.5
    capacity: 20000
    residual_lr: 0.001
    l1_weight: 0.05
