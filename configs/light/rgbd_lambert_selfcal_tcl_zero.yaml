# Self-calibration WITHOUT measuring the light position (docs/DECISIONS.md
# D108, option 1): rgbd_lambert_selfcal_tcl_ruler.yaml with t_CL starting at
# the camera centre (0, 0, 0) and learned on all three axes. No prior: the
# start is not a measurement, pulling towards it would be wrong. On the
# calibration clip the same start converged (D106); in SLAM the albedo is
# unknown and the map is still forming.
inherit_from: "configs/light/rgbd_lambert_selfcal_tcl_ruler.yaml"

Light:
  pose:
    t_CL: {_replace: true, source: value, value: [0.0, 0.0, 0.0], learnable: true, lr: 1.0e-4, prior_weight: 0.0}
