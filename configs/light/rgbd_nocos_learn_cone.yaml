# Self-calibration (docs/DECISIONS.md D60): rgbd_nocos.yaml with BOTH the
# half-angle and the light axis learnable, starting from the CORRECT
# (estimated) values: control, the learning must not drift, learned during
# MAPPING only (never in tracking). Compare with rgbd_nocos.yaml (0.0156 m).
#
# lr: Adam step size in the parameter's unit (degrees). Starting value
# 0.01 deg per mapping iteration: a 2-5 deg error needs a few hundred steps
# and a run has thousands; the synthetic wall of tests/light/test_learning.py
# converges with 0.05. after_keyframes 10 = Training.window_size: start once
# the first window is mapped. prior_weight 0: pure self-calibration, nothing
# pulls back to the (wrong) starting value. TO CONFIRM.
inherit_from: "configs/light/rgbd_nocos.yaml"

Light:
  angular:
    half_angle_deg: {learnable: true, lr: 0.01, prior_weight: 0.0}
  pose:
    R_CL: {learnable: true, lr: 0.01, prior_weight: 0.0}
  schedule:
    - {after_keyframes: 10, unfreeze: [angular.half_angle_deg, pose.R_CL]}
