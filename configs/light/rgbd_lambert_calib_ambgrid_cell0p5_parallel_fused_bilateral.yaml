# Main model run (rgbd_lambert_calib_ambgrid_cell0p5_parallel_fused.yaml, D139)
# with normals from the sensor depth smoothed by an edge-preserving bilateral
# filter (sensor_depth_bilateral_fd_edge, docs/DECISIONS.md D146), for NOISY
# sensor depth (D145: 1-pixel differences of noisy depth are off by 35-64 deg).
# Parameters chosen on office0 frames 0..1600 (scratch sweep of radius 3-7,
# sigma_range_rel 0.01-0.1, stencil 1-5), median normal error against the
# clean-depth normals:
#   clean 2.0 deg, light noise (D72) 2.7 deg, heavy noise (D75) 15.8 deg,
#   vs 0 / 53.6 / 74.5 deg for sensor_depth_fd_edge with stencil 1.
# A wider range sigma helps the heavy level a little more but blurs depth
# edges (more pixels off by > 30 deg on clean depth).
inherit_from: "configs/light/rgbd_lambert_calib_ambgrid_cell0p5_parallel_fused.yaml"

Light:
  cosine:
    normal_source:
      type: sensor_depth_bilateral_fd_edge
      stencil_px: 4
      bilateral: {radius_px: 7, sigma_space_px: 3.5, sigma_range_rel: 0.06}
