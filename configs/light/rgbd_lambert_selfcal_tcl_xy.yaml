# Self-calibration without measuring the light position, LATERAL offset only
# (docs/DECISIONS.md D108, option 2): rgbd_lambert_selfcal_tcl_zero.yaml with
# t_CL z kept at 0 (lamp in the plane of the lens, as most mounts) via
# learn_mask. z, the offset along the optical axis, is the direction that
# drifted 1-1.5 cm both in the pre-calibration (D106) and when the
# calibrated lamp kept learning in SLAM (D107); x, y were found within ~2 mm.
inherit_from: "configs/light/rgbd_lambert_selfcal_tcl_ruler.yaml"

Light:
  pose:
    t_CL: {_replace: true, source: value, value: [0.0, 0.0, 0.0], learnable: true, lr: 1.0e-4, prior_weight: 0.0,
           learn_mask: [true, true, false]}
