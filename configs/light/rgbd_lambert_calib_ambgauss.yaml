# Main model with an ambient light that varies over the scene
# (docs/DECISIONS.md D121): E_i = c + r_i per Gaussian, for rooms lit by
# static lamps besides the co-located one (data: office0 ambvar_*).
#   - c: the global level, learned in mapping exactly as in the main model;
#   - r_i: per-Gaussian residual (1 value: white static lights), mapping
#     Adam with residual_lr, off until the map has more than
#     residual_after_keyframes keyframes so that c settles first (c reached
#     its value within 100-200 frames in D120);
#   - l1_weight * mean |A r| per rendered keyframe pulls r to 0 where the
#     data do not need it (CLAUDE.md 4.3). Same units as the photometric
#     term (Training.alpha 0.95): a first guess, to sweep.
inherit_from: "configs/light/rgbd_lambert_calib.yaml"

Light:
  ambient:
    _replace: true
    type: per_gaussian
    c: {source: value, value: 0.05, learnable: true, lr: 0.001, prior_weight: 0.0, at_bound: project}
    channels: 1
    residual_lr: 0.001
    residual_after_keyframes: 20
    l1_weight: 0.05
