# The main model with the scene's ambient light c learned 10x faster
# (docs/DECISIONS.md D120): lr 1e-3 instead of 1e-4, same guess (0.05) and same
# schedule. On amb_0p5 (true c 0.5) the main model needed half the sequence to
# reach c, and its ATE loss sat in the first 250 frames (D118); if that start is
# the cause, a faster c should remove most of it. Also run on `lit` to check that
# a faster c does not hurt where the guess is close.
inherit_from: "configs/light/rgbd_lambert_calib.yaml"

Light:
  ambient:
    c: {lr: 0.001}
